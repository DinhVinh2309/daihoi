<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="100%" height="100%">
  <defs>
    <filter id="doodle-card-filter" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
    </filter>
  </defs>

  <g filter="url(#doodle-card-filter)">
    <!-- Card background with hand-drawn paper look -->
    <rect x="8" y="8" width="384" height="324" rx="16" fill="#ffffff" stroke="#263238" stroke-width="3.5" />
    
    <!-- Top decorative accent -->
    <path d="M 8 22 Q 200 36 392 22 L 392 8 L 8 8 Z" fill="#f87171" opacity="0.25" />
    
    <!-- Top left washi tape effect -->
    <polygon points="35,0 95,3 90,20 30,17" fill="#ffd100" opacity="0.85" stroke="#263238" stroke-width="1.5" />

    <!-- Corner pushpin -->
    <circle cx="360" cy="24" r="7" fill="#e63946" stroke="#263238" stroke-width="2" />
    <circle cx="358" cy="22" r="2" fill="#ffffff" />

    <!-- Main illustration content -->
    
            <!-- Candle of Remembrance & Red Star of Gratitude -->
            <polygon points="200,60 215,98 255,98 223,122 235,160 200,136 165,160 177,122 145,98 185,98" 
                     fill="#ffd100" stroke="#263238" stroke-width="3.5" stroke-linejoin="round"/>
            <circle cx="200" cy="110" r="65" fill="#fffbeb" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
            <!-- White lotus flower -->
            <g transform="translate(150, 195)">
                <path d="M 50 80 C 10 60, 20 20, 50 0 C 80 20, 90 60, 50 80 Z" fill="#ffffff" stroke="#263238" stroke-width="3"/>
                <path d="M 50 80 C 70 65, 80 40, 75 25 C 95 45, 95 70, 50 80 Z" fill="#fce7f3" stroke="#263238" stroke-width="2.5"/>
                <path d="M 50 80 C 30 65, 20 40, 25 25 C 5 45, 5 70, 50 80 Z" fill="#fce7f3" stroke="#263238" stroke-width="2.5"/>
                <circle cx="50" cy="50" r="12" fill="#fef08a" stroke="#263238" stroke-width="2"/>
            </g>
            <!-- Flame candle -->
            <g transform="translate(70, 160)">
                <rect x="25" y="60" width="30" height="70" rx="5" fill="#f1f5f9" stroke="#263238" stroke-width="3"/>
                <path d="M 40 60 L 40 45" stroke="#263238" stroke-width="3"/>
                <path d="M 40 18 Q 30 35 40 45 Q 50 35 40 18 Z" fill="#ff5400" stroke="#263238" stroke-width="2"/>
                <path d="M 40 26 Q 35 37 40 43 Q 45 37 40 26 Z" fill="#ffd100"/>
            </g>
            <!-- Incense -->
            <g transform="translate(260, 170)">
                <line x1="25" y1="120" x2="25" y2="40" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
                <circle cx="25" cy="40" r="3" fill="#ef4444"/>
                <path d="M 25 38 Q 35 25 25 15 Q 15 5 25 -5" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="3 3"/>
            </g>
        

    <!-- Bottom label badge -->
    <g transform="translate(25, 292)">
      <rect x="0" y="0" width="350" height="28" rx="8" fill="#e63946" stroke="#263238" stroke-width="2" />
      <text x="175" y="19" font-family="'Patrick Hand', 'Mali', cursive, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        ★ ĐỀN ƠN ĐÁP NGHĨA - VỀ NGUỒN ★
      </text>
    </g>
  </g>
</svg>