<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="100%" height="100%">
  <defs>
    <filter id="doodle-card-filter" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
    </filter>
  </defs>

  <g filter="url(#doodle-card-filter)">
    <!-- Card background with hand-drawn paper look -->
    <rect x="8" y="8" width="384" height="324" rx="16" fill="#ffffff" stroke="#263238" stroke-width="3.5" />
    
    <!-- Top decorative accent -->
    <path d="M 8 22 Q 200 36 392 22 L 392 8 L 8 8 Z" fill="#38bdf8" opacity="0.25" />
    
    <!-- Top left washi tape effect -->
    <polygon points="35,0 95,3 90,20 30,17" fill="#ffd100" opacity="0.85" stroke="#263238" stroke-width="1.5" />

    <!-- Corner pushpin -->
    <circle cx="360" cy="24" r="7" fill="#e63946" stroke="#263238" stroke-width="2" />
    <circle cx="358" cy="22" r="2" fill="#ffffff" />

    <!-- Main illustration content -->
    
            <!-- Big Glowing Lightbulb & Digital Screen -->
            <path d="M 160 190 C 130 160, 130 110, 170 80 C 210 50, 260 65, 275 110 C 285 145, 265 175, 240 190 L 240 230 L 160 230 Z" 
                  fill="#fff3b0" stroke="#263238" stroke-width="4"/>
            <rect x="170" y="230" width="60" height="12" rx="4" fill="#94a3b8" stroke="#263238" stroke-width="3"/>
            <rect x="175" y="244" width="50" height="12" rx="4" fill="#94a3b8" stroke="#263238" stroke-width="3"/>
            <path d="M 185 258 Q 200 270 215 258" stroke="#263238" stroke-width="3" fill="#64748b"/>
            <!-- Filament -->
            <path d="M 185 160 L 185 125 Q 185 105 200 115 Q 215 105 215 125 L 215 160" stroke="#f59e0b" stroke-width="4" fill="none"/>
            <!-- Laptop / Screen Hand-drawn -->
            <g transform="translate(130, 205)">
                <rect x="25" y="20" width="90" height="58" rx="8" fill="#ffffff" stroke="#263238" stroke-width="3.5"/>
                <rect x="32" y="27" width="76" height="44" fill="#e0f2fe"/>
                <line x1="38" y1="36" x2="68" y2="36" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
                <line x1="38" y1="46" x2="95" y2="46" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="38" y1="56" x2="80" y2="56" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
                <polygon points="10,82 130,82 120,78 20,78" fill="#cbd5e1" stroke="#263238" stroke-width="3"/>
            </g>
            <!-- Idea rays -->
            <line x1="200" y1="40" x2="200" y2="20" stroke="#ffb703" stroke-width="4" stroke-linecap="round"/>
            <line x1="260" y1="65" x2="280" y2="45" stroke="#ffb703" stroke-width="4" stroke-linecap="round"/>
            <line x1="140" y1="65" x2="120" y2="45" stroke="#ffb703" stroke-width="4" stroke-linecap="round"/>
        

    <!-- Bottom label badge -->
    <g transform="translate(25, 292)">
      <rect x="0" y="0" width="350" height="28" rx="8" fill="#0284c7" stroke="#263238" stroke-width="2" />
      <text x="175" y="19" font-family="'Patrick Hand', 'Mali', cursive, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        ★ TUỔI TRẺ SÁNG TẠO & SỐ HÓA ★
      </text>
    </g>
  </g>
</svg>