<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="100%" height="100%">
  <defs>
    <filter id="doodle-card-filter" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
    </filter>
  </defs>

  <g filter="url(#doodle-card-filter)">
    <!-- Card background with hand-drawn paper look -->
    <rect x="8" y="8" width="384" height="324" rx="16" fill="#ffffff" stroke="#263238" stroke-width="3.5" />
    
    <!-- Top decorative accent -->
    <path d="M 8 22 Q 200 36 392 22 L 392 8 L 8 8 Z" fill="#fdba74" opacity="0.25" />
    
    <!-- Top left washi tape effect -->
    <polygon points="35,0 95,3 90,20 30,17" fill="#ffd100" opacity="0.85" stroke="#263238" stroke-width="1.5" />

    <!-- Corner pushpin -->
    <circle cx="360" cy="24" r="7" fill="#e63946" stroke="#263238" stroke-width="2" />
    <circle cx="358" cy="22" r="2" fill="#ffffff" />

    <!-- Main illustration content -->
    
            <!-- Golden Trophy -->
            <g transform="translate(195, 55)">
                <path d="M 20 40 Q 20 110 50 120 L 50 145 L 30 145 L 30 165 L 70 165 L 70 145 L 50 145 L 50 120 Q 80 110 80 40 Z" 
                      fill="#ffd100" stroke="#263238" stroke-width="3.5"/>
                <circle cx="50" cy="25" r="12" fill="#ffd100" stroke="#263238" stroke-width="3"/>
                <path d="M 20 50 Q -10 65 22 90" stroke="#263238" stroke-width="3.5" fill="none"/>
                <path d="M 80 50 Q 110 65 78 90" stroke="#263238" stroke-width="3.5" fill="none"/>
                <polygon points="50,65 54,75 65,75 56,82 59,92 50,86 41,92 44,82 35,75 46,75" fill="#d97706"/>
            </g>
            <!-- Football / Soccer ball -->
            <g transform="translate(70, 140)">
                <circle cx="50" cy="50" r="42" fill="#ffffff" stroke="#263238" stroke-width="4"/>
                <polygon points="50,30 65,42 60,58 40,58 35,42" fill="#1e293b" stroke="#263238" stroke-width="2"/>
                <line x1="50" y1="30" x2="50" y2="10" stroke="#263238" stroke-width="2.5"/>
                <line x1="65" y1="42" x2="85" y2="35" stroke="#263238" stroke-width="2.5"/>
                <line x1="60" y1="58" x2="75" y2="75" stroke="#263238" stroke-width="2.5"/>
                <line x1="40" y1="58" x2="25" y2="75" stroke="#263238" stroke-width="2.5"/>
                <line x1="35" y1="42" x2="15" y2="35" stroke="#263238" stroke-width="2.5"/>
            </g>
            <!-- Running sneaker doodle -->
            <g transform="translate(210, 220) rotate(-10)">
                <path d="M 10 35 Q 25 15 50 15 L 75 35 Q 95 38 100 50 L 5 50 Z" fill="#0284c7" stroke="#263238" stroke-width="3"/>
                <rect x="0" y="50" width="105" height="12" rx="4" fill="#ffffff" stroke="#263238" stroke-width="2.5"/>
                <path d="M 40 20 L 55 35" stroke="#ffffff" stroke-width="3"/>
                <path d="M 48 18 L 63 33" stroke="#ffffff" stroke-width="3"/>
            </g>
        

    <!-- Bottom label badge -->
    <g transform="translate(25, 292)">
      <rect x="0" y="0" width="350" height="28" rx="8" fill="#f97316" stroke="#263238" stroke-width="2" />
      <text x="175" y="19" font-family="'Patrick Hand', 'Mali', cursive, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        ★ NGÀY HỘI THỂ THAO THANH NIÊN ★
      </text>
    </g>
  </g>
</svg>