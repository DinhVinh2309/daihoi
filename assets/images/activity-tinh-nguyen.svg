<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="100%" height="100%">
  <defs>
    <filter id="doodle-card-filter" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
    </filter>
  </defs>

  <g filter="url(#doodle-card-filter)">
    <!-- Card background with hand-drawn paper look -->
    <rect x="8" y="8" width="384" height="324" rx="16" fill="#ffffff" stroke="#263238" stroke-width="3.5" />
    
    <!-- Top decorative accent -->
    <path d="M 8 22 Q 200 36 392 22 L 392 8 L 8 8 Z" fill="#52b788" opacity="0.25" />
    
    <!-- Top left washi tape effect -->
    <polygon points="35,0 95,3 90,20 30,17" fill="#ffd100" opacity="0.85" stroke="#263238" stroke-width="1.5" />

    <!-- Corner pushpin -->
    <circle cx="360" cy="24" r="7" fill="#e63946" stroke="#263238" stroke-width="2" />
    <circle cx="358" cy="22" r="2" fill="#ffffff" />

    <!-- Main illustration content -->
    
            <!-- Tree and Green Youth Symbol -->
            <path d="M 180 300 L 220 300 L 210 210 L 190 210 Z" fill="#8b5a2b" stroke="#263238" stroke-width="4" />
            <circle cx="200" cy="165" r="65" fill="#52b788" stroke="#263238" stroke-width="4" />
            <circle cx="160" cy="145" r="45" fill="#40916c" stroke="#263238" stroke-width="3" />
            <circle cx="240" cy="145" r="45" fill="#74c69d" stroke="#263238" stroke-width="3" />
            <circle cx="200" cy="120" r="40" fill="#52b788" stroke="#263238" stroke-width="3" />
            <!-- Watering can & heart -->
            <g transform="translate(250, 210) rotate(-15)">
                <rect x="0" y="20" width="60" height="50" rx="10" fill="#0077e6" stroke="#263238" stroke-width="3.5"/>
                <path d="M 55 35 L 85 20" stroke="#263238" stroke-width="5" stroke-linecap="round"/>
                <circle cx="88" cy="19" r="7" fill="#ffd100" stroke="#263238" stroke-width="2"/>
                <path d="M 10 20 Q -15 20 -15 45 Q -15 70 10 70" stroke="#263238" stroke-width="4" fill="none"/>
                <!-- Water droplets -->
                <ellipse cx="100" cy="35" rx="3" ry="5" fill="#38bdf8"/>
                <ellipse cx="108" cy="48" rx="3" ry="5" fill="#38bdf8"/>
                <ellipse cx="116" cy="62" rx="3" ry="5" fill="#38bdf8"/>
            </g>
            <!-- Hand planting sprout -->
            <g transform="translate(90, 230)">
                <path d="M 20 50 Q 50 30 75 45 Q 90 20 100 45 L 80 80 L 10 70 Z" fill="#fed7aa" stroke="#263238" stroke-width="3.5"/>
                <path d="M 5 55 L -20 80" stroke="#0077e6" stroke-width="22" stroke-linecap="round"/>
            </g>
        

    <!-- Bottom label badge -->
    <g transform="translate(25, 292)">
      <rect x="0" y="0" width="350" height="28" rx="8" fill="#2a9d8f" stroke="#263238" stroke-width="2" />
      <text x="175" y="19" font-family="'Patrick Hand', 'Mali', cursive, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        ★ MÙA HÈ XANH & TÌNH NGUYỆN ★
      </text>
    </g>
  </g>
</svg>