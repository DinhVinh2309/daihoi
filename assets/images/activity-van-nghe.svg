<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="100%" height="100%">
  <defs>
    <filter id="doodle-card-filter" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
    </filter>
  </defs>

  <g filter="url(#doodle-card-filter)">
    <!-- Card background with hand-drawn paper look -->
    <rect x="8" y="8" width="384" height="324" rx="16" fill="#ffffff" stroke="#263238" stroke-width="3.5" />
    
    <!-- Top decorative accent -->
    <path d="M 8 22 Q 200 36 392 22 L 392 8 L 8 8 Z" fill="#c084fc" opacity="0.25" />
    
    <!-- Top left washi tape effect -->
    <polygon points="35,0 95,3 90,20 30,17" fill="#ffd100" opacity="0.85" stroke="#263238" stroke-width="1.5" />

    <!-- Corner pushpin -->
    <circle cx="360" cy="24" r="7" fill="#e63946" stroke="#263238" stroke-width="2" />
    <circle cx="358" cy="22" r="2" fill="#ffffff" />

    <!-- Main illustration content -->
    
            <!-- Acoustic Guitar of Youth Union -->
            <g transform="translate(150, 50) rotate(25)">
                <rect x="55" y="0" width="14" height="120" fill="#92400e" stroke="#263238" stroke-width="3"/>
                <rect x="52" y="-30" width="20" height="35" rx="3" fill="#78350f" stroke="#263238" stroke-width="3"/>
                <path d="M 40 120 C 10 135, 10 170, 35 185 C 20 205, 15 250, 45 270 C 80 290, 100 250, 90 230 C 110 205, 105 185, 90 185 C 115 170, 115 135, 85 120 Z" 
                      fill="#f59e0b" stroke="#263238" stroke-width="3.5"/>
                <circle cx="62" cy="180" r="16" fill="#451a03" stroke="#263238" stroke-width="2.5"/>
                <line x1="62" y1="0" x2="62" y2="250" stroke="#ffffff" stroke-width="1.5"/>
                <line x1="58" y1="0" x2="58" y2="250" stroke="#ffffff" stroke-width="1.2"/>
                <line x1="66" y1="0" x2="66" y2="250" stroke="#ffffff" stroke-width="1.2"/>
            </g>
            <!-- Musical notes floating -->
            <g fill="#7209b7" stroke="#263238" stroke-width="2">
                <g transform="translate(70, 60)">
                    <circle cx="10" cy="25" r="7" fill="#f72585"/>
                    <line x1="17" y1="25" x2="17" y2="5" stroke="#263238" stroke-width="3"/>
                    <path d="M 17 5 Q 28 8 26 18" stroke="#263238" stroke-width="3" fill="none"/>
                </g>
                <g transform="translate(280, 80)">
                    <circle cx="10" cy="30" r="6" fill="#4361ee"/>
                    <circle cx="30" cy="25" r="6" fill="#4361ee"/>
                    <line x1="16" y1="30" x2="16" y2="10" stroke="#263238" stroke-width="3"/>
                    <line x1="36" y1="25" x2="36" y2="5" stroke="#263238" stroke-width="3"/>
                    <polygon points="16,10 36,5 36,12 16,17" fill="#263238"/>
                </g>
            </g>
        

    <!-- Bottom label badge -->
    <g transform="translate(25, 292)">
      <rect x="0" y="0" width="350" height="28" rx="8" fill="#8b5cf6" stroke="#263238" stroke-width="2" />
      <text x="175" y="19" font-family="'Patrick Hand', 'Mali', cursive, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        ★ VĂN HÓA - VĂN NGHỆ THANH NIÊN ★
      </text>
    </g>
  </g>
</svg>