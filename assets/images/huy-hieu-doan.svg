<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Filter for subtle hand-drawn wobble effect -->
    <filter id="hand-drawn-wobble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" />
    </filter>
    <linearGradient id="flag-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b3b" />
      <stop offset="100%" stop-color="#d90429" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0080ff" />
      <stop offset="100%" stop-color="#0050a0" />
    </linearGradient>
  </defs>

  <g filter="url(#hand-drawn-wobble)">
    <!-- Outer circle border (sketchy double line) -->
    <circle cx="150" cy="150" r="135" fill="#fffdf8" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="350 8 300 6" />
    <circle cx="150" cy="150" r="126" fill="#f0f7ff" stroke="#0066cc" stroke-width="3" stroke-dasharray="4 2" />

    <!-- Gear / Cog teeth around edges (Youth Union symbol element) -->
    <g stroke="#0066cc" stroke-width="3" fill="#e0f2fe">
      <path d="M 140 16 L 160 16 L 157 28 L 143 28 Z" />
      <path d="M 230 52 L 244 66 L 234 76 L 220 62 Z" />
      <path d="M 272 140 L 272 160 L 260 157 L 260 143 Z" />
      <path d="M 244 234 L 230 248 L 220 238 L 234 224 Z" />
      <path d="M 160 274 L 140 274 L 143 262 L 157 262 Z" />
      <path d="M 66 248 L 52 234 L 62 220 L 76 234 Z" />
      <path d="M 24 160 L 24 140 L 36 143 L 36 157 Z" />
      <path d="M 52 66 L 66 52 L 76 62 L 62 76 Z" />
    </g>

    <!-- Inner Shield / Circle -->
    <circle cx="150" cy="150" r="110" fill="url(#shield-grad)" stroke="#1e293b" stroke-width="3.5" />

    <!-- Youth Union Flag in center: Red flag waving -->
    <path d="M 110 80 C 135 68, 175 92, 215 78 C 220 120, 205 145, 210 165 C 175 178, 140 150, 110 168 Z" 
          fill="url(#flag-grad)" stroke="#1e293b" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Yellow star on flag -->
    <polygon points="160,95 165,110 180,110 168,120 172,135 160,125 148,135 152,120 140,110 155,110" 
             fill="#ffd100" stroke="#d48b00" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Hand holding the flagpole (Cánh tay vững vàng cầm cờ) -->
    <!-- Flagpole -->
    <line x1="108" y1="65" x2="108" y2="215" stroke="#ffd100" stroke-width="6" stroke-linecap="round"/>
    <line x1="108" y1="65" x2="108" y2="215" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
    <!-- Finial ball on pole -->
    <circle cx="108" cy="62" r="7" fill="#ffd100" stroke="#1e293b" stroke-width="2"/>

    <!-- Strong hand sleeve & fist grasping flagpole -->
    <!-- Blue sleeve -->
    <path d="M 68 200 C 75 180, 95 180, 112 185 L 110 220 C 90 225, 75 220, 68 200 Z" fill="#004a99" stroke="#1e293b" stroke-width="3"/>
    <!-- Hand fist skin tone -->
    <path d="M 98 165 C 98 155, 118 155, 120 165 C 122 175, 122 185, 118 192 C 110 196, 98 190, 98 165 Z" fill="#fed7aa" stroke="#1e293b" stroke-width="3"/>
    <!-- Fingers wrapped around pole -->
    <path d="M 104 164 C 114 163, 116 172, 106 173" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 104 173 C 114 172, 116 181, 106 182" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 104 182 C 114 181, 116 190, 106 191" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Bottom Ribbon with text "SẴN SÀNG" -->
    <path d="M 70 220 Q 150 248 230 220 L 225 252 Q 150 278 75 252 Z" fill="#ffd100" stroke="#1e293b" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Ribbon tails -->
    <path d="M 70 220 L 50 235 L 75 252 Z" fill="#e5b800" stroke="#1e293b" stroke-width="2.5"/>
    <path d="M 230 220 L 250 235 L 225 252 Z" fill="#e5b800" stroke="#1e293b" stroke-width="2.5"/>
    <text x="150" y="246" text-anchor="middle" font-family="'Patrick Hand', 'Mali', cursive, sans-serif" font-weight="bold" font-size="20" fill="#d90429" letter-spacing="3">SẴN SÀNG</text>
  </g>
</svg>