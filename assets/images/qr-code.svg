<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <filter id="doodle-qr" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
    </filter>
  </defs>
  <g filter="url(#doodle-qr)">
    <!-- White paper square -->
    <rect x="10" y="10" width="220" height="220" rx="14" fill="#ffffff" stroke="#263238" stroke-width="3.5"/>
    
    <!-- Top-Left Corner Box -->
    <rect x="30" y="30" width="50" height="50" rx="6" fill="#0066cc" stroke="#263238" stroke-width="2.5"/>
    <rect x="42" y="42" width="26" height="26" fill="#ffffff"/>
    <rect x="48" y="48" width="14" height="14" fill="#0066cc"/>

    <!-- Top-Right Corner Box -->
    <rect x="160" y="30" width="50" height="50" rx="6" fill="#0066cc" stroke="#263238" stroke-width="2.5"/>
    <rect x="172" y="42" width="26" height="26" fill="#ffffff"/>
    <rect x="178" y="48" width="14" height="14" fill="#0066cc"/>

    <!-- Bottom-Left Corner Box -->
    <rect x="30" y="160" width="50" height="50" rx="6" fill="#0066cc" stroke="#263238" stroke-width="2.5"/>
    <rect x="42" y="172" width="26" height="26" fill="#ffffff"/>
    <rect x="48" y="178" width="14" height="14" fill="#0066cc"/>

    <!-- Hand-drawn data dots / grid pattern -->
    <g fill="#263238">
      <rect x="95" y="30" width="12" height="12" rx="2"/>
      <rect x="115" y="30" width="12" height="12" rx="2"/>
      <rect x="135" y="30" width="12" height="12" rx="2"/>
      <rect x="95" y="50" width="12" height="12" rx="2"/>
      <rect x="135" y="50" width="12" height="12" rx="2"/>
      <rect x="95" y="70" width="32" height="12" rx="2"/>
      <rect x="30" y="95" width="12" height="32" rx="2"/>
      <rect x="50" y="115" width="12" height="12" rx="2"/>
      <rect x="70" y="95" width="12" height="12" rx="2"/>
      <rect x="70" y="135" width="12" height="12" rx="2"/>
      <rect x="160" y="95" width="32" height="12" rx="2"/>
      <rect x="180" y="115" width="12" height="32" rx="2"/>
      <rect x="95" y="95" width="14" height="14" rx="2" fill="#e63946"/>
      <rect x="115" y="115" width="14" height="14" rx="2" fill="#ffd100"/>
      <rect x="135" y="95" width="14" height="14" rx="2" fill="#2a9d8f"/>
      <rect x="95" y="135" width="12" height="12" rx="2"/>
      <rect x="115" y="135" width="32" height="12" rx="2"/>
      <rect x="95" y="160" width="32" height="12" rx="2"/>
      <rect x="135" y="175" width="12" height="32" rx="2"/>
      <rect x="160" y="160" width="12" height="12" rx="2"/>
      <rect x="180" y="175" width="12" height="12" rx="2"/>
      <rect x="160" y="195" width="32" height="12" rx="2"/>
    </g>

    <!-- Center Youth Union Badge doodle icon -->
    <circle cx="120" cy="120" r="18" fill="#ffffff" stroke="#263238" stroke-width="2.5"/>
    <circle cx="120" cy="120" r="14" fill="#e63946"/>
    <polygon points="120,110 123,117 130,117 125,122 127,129 120,125 113,129 115,122 110,117 117,117" fill="#ffd100"/>
  </g>
</svg>